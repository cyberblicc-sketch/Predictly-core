name: PREDICTLY // CI COMPILATION TEST

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  audit-and-build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Initialize Bun Environment
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Install Dependencies
      run: bun install

    - name: Generate Prisma Client
      run: bunx prisma generate
      env:
        DATABASE_URL: file:./ci.db

    - name: Build Next.js Application
      run: bun run build
      env:
        DATABASE_URL: file:./ci.db
        NEXT_PUBLIC_APP_URL: https://predictly-core.vercel.app
        NEXT_PUBLIC_SUPABASE_URL: https://mockproject.supabase.co
        NEXT_PUBLIC_SUPABASE_ANON_KEY: mock_anon_key_for_ci_build
        NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
        NEXTAUTH_URL: http://localhost:3000
